[project]
name = "notifica-govbr"
version = "0.1.1"
description = "Biblioteca para o serviço de notificações do gov.br"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.162.0", "pydantic-settings>=2.16.1"]
django = ["django>=6.1.2"]


[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "respx>=0.23.1"]
